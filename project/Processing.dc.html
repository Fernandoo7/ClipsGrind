<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ClipsGrind — Processando</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050608;color:#F4F5F3;font-family:'Inter',system-ui,-apple-system,sans-serif}
a{color:#CFFF4D;text-decoration:none}
a:hover{color:#E4FF8F}
@keyframes cg-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes cg-rise{0%{transform:translateY(42%)}100%{transform:translateY(-142%)}}
</style>
</helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<div style="position:relative; width:100%; min-height:100vh; background:#050608; overflow:hidden">
  <div aria-hidden="true" style="position:absolute; inset:0; z-index:0; overflow:hidden; filter:blur(42px)">
    <div style="position:absolute; top:0; left:4%; width:160px; height:100%; transform:rotate(-32deg)"><div style="position:absolute; left:0; top:-60%; width:100%; height:220%; background:linear-gradient(to bottom, transparent, hsla(195,85%,65%,0.22), transparent); animation:cg-rise 11s linear infinite; animation-delay:-2s"></div></div>
    <div style="position:absolute; top:0; left:18%; width:120px; height:100%; transform:rotate(-32deg)"><div style="position:absolute; left:0; top:-60%; width:100%; height:220%; background:linear-gradient(to bottom, transparent, hsla(205,85%,65%,0.2), transparent); animation:cg-rise 13s linear infinite; animation-delay:-6s"></div></div>
    <div style="position:absolute; top:0; left:34%; width:200px; height:100%; transform:rotate(-32deg)"><div style="position:absolute; left:0; top:-60%; width:100%; height:220%; background:linear-gradient(to bottom, transparent, hsla(215,85%,65%,0.24), transparent); animation:cg-rise 9s linear infinite; animation-delay:-1s"></div></div>
    <div style="position:absolute; top:0; left:52%; width:140px; height:100%; transform:rotate(-32deg)"><div style="position:absolute; left:0; top:-60%; width:100%; height:220%; background:linear-gradient(to bottom, transparent, hsla(228,85%,65%,0.2), transparent); animation:cg-rise 14s linear infinite; animation-delay:-9s"></div></div>
    <div style="position:absolute; top:0; left:68%; width:180px; height:100%; transform:rotate(-32deg)"><div style="position:absolute; left:0; top:-60%; width:100%; height:220%; background:linear-gradient(to bottom, transparent, hsla(240,85%,65%,0.22), transparent); animation:cg-rise 10s linear infinite; animation-delay:-4s"></div></div>
    <div style="position:absolute; top:0; left:84%; width:130px; height:100%; transform:rotate(-32deg)"><div style="position:absolute; left:0; top:-60%; width:100%; height:220%; background:linear-gradient(to bottom, transparent, hsla(250,85%,65%,0.2), transparent); animation:cg-rise 12s linear infinite; animation-delay:-7s"></div></div>
    <div style="position:absolute; inset:0; background:radial-gradient(circle at 50% 30%, rgba(5,6,8,0) 0%, rgba(5,6,8,0.65) 72%)"></div>
  </div>
  <div style="position:relative; z-index:1; width:100%; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:48px 24px">

  <div style="width:100%; max-width:1200px; display:flex; align-items:center; gap:10px">
    <div style="width:28px; height:28px; border-radius:7px; background:{{accent}}; display:flex; align-items:center; justify-content:center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B0D10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
    </div>
    <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px">Clips<span style="color:{{accent}}">Grind</span></span>
  </div>

  <div style="width:100%; max-width:560px; margin:auto 0">

    <div style="display:flex; align-items:center; gap:10px; padding:12px 16px; background:#101316; border:1px solid #1C2126; border-radius:10px; margin-bottom:28px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6470" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 1 0-7.07-7.07L11.5 4.5"></path><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 1 0 7.07 7.07L12.5 19.5"></path></svg>
      <span style="font-size:13px; color:#9AA3AC; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">youtube.com/watch?v=3iN8AK2cJjM — Live de hoje</span>
    </div>

    <h1 style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:30px; margin:0 0 8px">{{stageHeading}}</h1>
    <p style="font-size:15px; color:#9AA3AC; margin:0 0 32px">{{stageSub}}</p>

    <div style="height:6px; background:#1C2126; border-radius:999px; overflow:hidden; margin-bottom:32px">
      <div style="height:100%; border-radius:999px; background:{{accent}}; width:{{progressPercent}}%"></div>
    </div>

    <div style="display:flex; flex-direction:column; gap:4px">
      <sc-for list="{{steps}}" as="step" hint-placeholder-count="5">
        <div style="display:flex; align-items:center; gap:14px; padding:14px 4px">
          <sc-if value="{{step.done}}" hint-placeholder-val="{{false}}">
            <div style="width:26px; height:26px; border-radius:50%; background:{{accent}}; display:flex; align-items:center; justify-content:center; flex-shrink:0">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B0D10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </sc-if>
          <sc-if value="{{step.active}}" hint-placeholder-val="{{false}}">
            <div style="width:26px; height:26px; border-radius:50%; border:2px solid {{accent}}; display:flex; align-items:center; justify-content:center; flex-shrink:0">
              <div style="width:8px; height:8px; border-radius:50%; background:{{accent}}; animation:cg-pulse 1.4s ease-in-out infinite"></div>
            </div>
          </sc-if>
          <sc-if value="{{step.pending}}" hint-placeholder-val="{{true}}">
            <div style="width:26px; height:26px; border-radius:50%; border:2px solid #262B31; flex-shrink:0"></div>
          </sc-if>
          <span style="font-size:15px; color:{{step.textColor}}">{{step.label}}</span>
        </div>
      </sc-for>
    </div>

    <p style="font-size:13px; color:#5B6470; margin:28px 0 0">Tempo estimado: {{etaText}}</p>

    <div style="display:flex; gap:14px; margin-top:40px">
      <a href="Main.dc.html" style="padding:13px 20px; border:1px solid #262B31; border-radius:10px; color:#9AA3AC; font-size:14px">Cancelar</a>
      <a href="Results.dc.html" style="flex:1; display:flex; align-items:center; justify-content:center; padding:13px 20px; background:{{accent}}; color:#0B0D10; border-radius:10px; font-weight:600; font-size:14px">Ver clipes quando prontos</a>
    </div>

  </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#CFFF4D","options":["#CFFF4D","#FF8A3D","#5AD1FF"]},"stage":{"editor":"enum","default":"analisando","options":["baixando","transcrevendo","analisando","cortando","pronto"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#CFFF4D';
    const order = ['baixando', 'transcrevendo', 'analisando', 'cortando', 'pronto'];
    const labels = {
      baixando: 'Baixando o vídeo',
      transcrevendo: 'Transcrevendo o áudio',
      analisando: 'Analisando os melhores momentos',
      cortando: 'Cortando e legendando os clipes',
      pronto: 'Gerando título, descrição e hashtags',
    };
    const heading = {
      baixando: 'Baixando sua live…',
      transcrevendo: 'Transcrevendo o áudio…',
      analisando: 'Procurando os melhores momentos…',
      cortando: 'Cortando e legendando…',
      pronto: 'Quase lá…',
    };
    const sub = {
      baixando: 'Pegando o vídeo a partir do link enviado.',
      transcrevendo: 'Convertendo a fala em texto com marcação de tempo.',
      analisando: 'A IA está lendo a transcrição e marcando os ganchos mais fortes.',
      cortando: 'Gerando os cortes em 9:16 com a legenda embutida.',
      pronto: 'Escrevendo título, descrição e hashtags de cada clipe.',
    };
    const pct = { baixando: 12, transcrevendo: 34, analisando: 58, cortando: 82, pronto: 96 };
    const stage = this.props.stage ?? 'analisando';
    const idx = order.indexOf(stage);
    const steps = order.map((id, i) => ({
      label: labels[id],
      done: i < idx,
      active: i === idx,
      pending: i > idx,
      textColor: i <= idx ? '#F4F5F3' : '#5B6470',
    }));
    return {
      accent,
      steps,
      stageHeading: heading[stage],
      stageSub: sub[stage],
      progressPercent: pct[stage],
      etaText: stage === 'pronto' ? 'menos de 1 min' : '3–6 min, depende do tamanho da live',
    };
  }
}
</script>
</body>
</html>
