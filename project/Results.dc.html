<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ClipsGrind — Clipes prontos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050608;color:#F4F5F3;font-family:'Inter',system-ui,-apple-system,sans-serif}
a{color:#CFFF4D;text-decoration:none}
a:hover{color:#E4FF8F}
@keyframes cg-rise{0%{transform:translateY(42%)}100%{transform:translateY(-142%)}}
</style>
</helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<div style="position:relative; width:100%; min-height:100vh; background:#050608; overflow:hidden">
  <div aria-hidden="true" style="position:absolute; inset:0; z-index:0; overflow:hidden; filter:blur(42px)">
    <div style="position:absolute; top:0; left:4%; width:160px; height:100%; transform:rotate(-32deg)"><div style="position:absolute; left:0; top:-60%; width:100%; height:220%; background:linear-gradient(to bottom, transparent, hsla(195,85%,65%,0.22), transparent); animation:cg-rise 11s linear infinite; animation-delay:-2s"></div></div>
    <div style="position:absolute; top:0; left:18%; width:120px; height:100%; transform:rotate(-32deg)"><div style="position:absolute; left:0; top:-60%; width:100%; height:220%; background:linear-gradient(to bottom, transparent, hsla(205,85%,65%,0.2), transparent); animation:cg-rise 13s linear infinite; animation-delay:-6s"></div></div>
    <div style="position:absolute; top:0; left:34%; width:200px; height:100%; transform:rotate(-32deg)"><div style="position:absolute; left:0; top:-60%; width:100%; height:220%; background:linear-gradient(to bottom, transparent, hsla(215,85%,65%,0.24), transparent); animation:cg-rise 9s linear infinite; animation-delay:-1s"></div></div>
    <div style="position:absolute; top:0; left:52%; width:140px; height:100%; transform:rotate(-32deg)"><div style="position:absolute; left:0; top:-60%; width:100%; height:220%; background:linear-gradient(to bottom, transparent, hsla(228,85%,65%,0.2), transparent); animation:cg-rise 14s linear infinite; animation-delay:-9s"></div></div>
    <div style="position:absolute; top:0; left:68%; width:180px; height:100%; transform:rotate(-32deg)"><div style="position:absolute; left:0; top:-60%; width:100%; height:220%; background:linear-gradient(to bottom, transparent, hsla(240,85%,65%,0.22), transparent); animation:cg-rise 10s linear infinite; animation-delay:-4s"></div></div>
    <div style="position:absolute; top:0; left:84%; width:130px; height:100%; transform:rotate(-32deg)"><div style="position:absolute; left:0; top:-60%; width:100%; height:220%; background:linear-gradient(to bottom, transparent, hsla(250,85%,65%,0.2), transparent); animation:cg-rise 12s linear infinite; animation-delay:-7s"></div></div>
    <div style="position:absolute; inset:0; background:radial-gradient(circle at 50% 30%, rgba(5,6,8,0) 0%, rgba(5,6,8,0.65) 72%)"></div>
  </div>
  <div style="position:relative; z-index:1; width:100%; min-height:100vh; display:flex; flex-direction:column">

  <header style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; padding:24px 56px; border-bottom:1px solid #1C2126">
    <div style="display:flex; align-items:center; gap:16px">
      <a href="Main.dc.html" style="display:flex; align-items:center; gap:8px; color:#9AA3AC; font-size:14px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA3AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
        Novo link
      </a>
      <div style="width:1px; height:20px; background:#262B31"></div>
      <div style="display:flex; align-items:center; gap:10px">
        <div style="width:26px; height:26px; border-radius:7px; background:{{accent}}; display:flex; align-items:center; justify-content:center">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B0D10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px">Clips<span style="color:{{accent}}">Grind</span></span>
      </div>
    </div>
    <button type="button" style="display:flex; align-items:center; gap:8px; padding:11px 18px; border:1px solid #262B31; border-radius:9px; background:transparent; color:#F4F5F3; font-size:14px; cursor:pointer">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F4F5F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
      Baixar todos
    </button>
  </header>

  <main style="flex:1; padding:40px 56px 72px">

    <div style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:8px">
      <div>
        <h1 style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; margin:0 0 8px">6 clipes prontos</h1>
        <p style="font-size:14px; color:#9AA3AC; margin:0">de "Live de hoje" · youtube.com/watch?v=3iN8AK2cJjM</p>
      </div>
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#9AA3AC">
        Ordenar por
        <select style="padding:9px 12px; background:#15181C; border:1px solid #262B31; border-radius:8px; color:#F4F5F3; font-size:13px">
          <option>Nota de viralidade</option>
          <option>Mais recentes</option>
          <option>Duração</option>
        </select>
      </label>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:24px; margin-top:32px">
      <sc-for list="{{clips}}" as="clip" hint-placeholder-count="6">
        <div style="display:flex; flex-direction:column; background:#101316; border:1px solid #1C2126; border-radius:14px; overflow:hidden">

          <div style="position:relative; width:100%; aspect-ratio:9/16; background:{{clip.thumbGradient}}; display:flex; align-items:center; justify-content:center">
            <div style="position:absolute; top:10px; left:10px; display:flex; align-items:center; gap:4px; padding:5px 9px; border-radius:999px; background:rgba(11,13,16,0.72); font-size:12px; font-weight:600; color:{{clip.scoreColor}}">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="{{clip.scoreColor}}" stroke="none"><path d="M13 2 4 14h6l-1 8 9-12h-6z"></path></svg>
              {{clip.score}}
            </div>
            <div style="position:absolute; bottom:10px; right:10px; padding:4px 9px; border-radius:6px; background:rgba(11,13,16,0.72); font-size:12px; color:#F4F5F3">{{clip.duration}}</div>
            <div style="width:48px; height:48px; border-radius:50%; background:rgba(11,13,16,0.55); display:flex; align-items:center; justify-content:center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="#F4F5F3" stroke="none"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
            </div>
          </div>

          <div style="padding:16px 16px 18px; display:flex; flex-direction:column; gap:10px; flex:1">
            <div>
              <h3 style="font-size:15px; font-weight:600; margin:0 0 4px; line-height:1.3">{{clip.title}}</h3>
              <p style="font-size:13px; color:#9AA3AC; margin:0; font-style:italic">"{{clip.hook}}"</p>
            </div>
            <span style="align-self:flex-start; padding:4px 10px; border-radius:999px; border:1px solid #262B31; font-size:12px; color:#9AA3AC">{{clip.hookType}}</span>
            <div style="display:flex; gap:8px; margin-top:auto">
              <button type="button" aria-label="Baixar clipe" style="flex:1; display:flex; align-items:center; justify-content:center; padding:9px; border-radius:8px; border:1px solid #262B31; background:transparent; cursor:pointer">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F4F5F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
              </button>
              <button type="button" aria-label="Postar no YouTube" style="flex:1; display:flex; align-items:center; justify-content:center; padding:9px; border-radius:8px; border:1px solid #262B31; background:transparent; cursor:pointer">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5B6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
              </button>
              <button type="button" aria-label="Editar clipe" style="flex:1; display:flex; align-items:center; justify-content:center; padding:9px; border-radius:8px; border:1px solid #262B31; background:transparent; cursor:pointer">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F4F5F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"></path></svg>
              </button>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

  </main>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#CFFF4D","options":["#CFFF4D","#FF8A3D","#5AD1FF"]},"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#CFFF4D';
    const grad = (a, b) => `linear-gradient(160deg, ${a}, ${b})`;
    const raw = [
      { title: 'Ele quase cai do telhado', hook: 'ISSO QUASE DEU RUIM', score: 94, duration: '0:38', hookType: 'Momento tenso', g: ['#1f2a33', '#0b0d10'] },
      { title: 'Jogada impossível de precisão', hook: 'NINGUÉM ACREDITOU NISSO', score: 88, duration: '0:52', hookType: 'Jogada', g: ['#20261c', '#0b0d10'] },
      { title: 'Perdeu a aposta e pagou a prenda', hook: 'A PRENDA FOI PESADA', score: 81, duration: '0:45', hookType: 'Fail', g: ['#2a2016', '#0b0d10'] },
      { title: 'Resposta engraçada no chat', hook: 'CHAT QUEBROU TUDO', score: 76, duration: '0:29', hookType: 'Interação', g: ['#1c2630', '#0b0d10'] },
      { title: 'A história da primeira vez jogando', hook: 'ISSO MUDOU TUDO PRA ELE', score: 69, duration: '0:58', hookType: 'História', g: ['#241c2c', '#0b0d10'] },
      { title: 'A frase que ficou famosa na live', hook: 'FRASE DO DIA', score: 62, duration: '0:24', hookType: 'Frase', g: ['#201c1c', '#0b0d10'] },
    ];
    const clips = raw.map((c) => ({
      ...c,
      thumbGradient: grad(c.g[0], c.g[1]),
      scoreColor: c.score >= 85 ? accent : c.score >= 70 ? '#FF8A3D' : '#9AA3AC',
    }));
    return { accent, clips };
  }
}
</script>
</body>
</html>
