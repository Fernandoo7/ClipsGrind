name: debug-models
on: workflow_dispatch
permissions:
  models: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -i https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"diga oi em json {\"a\":\"oi\"}"}]}' | head -c 1500; echo
          echo ----
          curl -sS -i https://models.github.ai/catalog/models -H "Authorization: Bearer $GH_TOKEN" | head -c 600
